{% extends 'base.html' %}

{% block title %}403 Forbidden - ToDo App{% endblock %}

{% block content %}
<div class='text-center py-5'>
    <h1 class='display-1 text-danger'>403</h1>
    <p class='lead'>アクセス権限がありません</p>
    <p>このリソースにアクセスする権限がありません。</p>
    <p class='text-muted'>他のユーザーのToDoは閲覧・編集できません。</p>
    <div class='mt-4'>
        <a href='{{ url_for('todos.index')}}' class='btn btn-primary'>
            <i class='bi bi-list-task'></i> 自分のToDoリストへ
        </a>
        <a href='{{ url_for('main.index')}}' class='btn btn-outline-secondary'>
            <i class='bi bi-house'></i> トップページへ
        </a>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css'>
{% endblock %}
