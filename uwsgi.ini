[uwsgi]
; ========== アプリケーション設定 ==========
; module: WSGI アプリのモジュールパス（run.py の app オブジェクト）
module= run:app

; callable: WSGI アプリのオブジェクト名（module 内の変数名）
callable= app

; ========== マスタープロセス設定 ==========
; master: マスタープロセスを有効にする
; マスタープロセスはワーカーの監視・再起動を担当する
master=true

; enable-threads: スレッドサポートを有効にする（threads 設定の前に必要）
enable-threads=true

; ========== プロセス数 / スレッド数 ==========
; processes: ワーカープロセスの数（Gunicorn の workers に相当）
; 4コアなら 4 程度が目安（CPU バウンドな処理向け）
processes=4

; threads: 各ワーカープロセス内のスレッド数
; processes × threads = 実質的な並行処理数（例: 4 × 2 = 8 並行）
threads=2

; ========== ソケット設定 ==========
; http: HTTP プロトコルで待ち受けるアドレスとポート
; ※ Nginx と uwsgi プロトコルで連携する場合は http の代わりに socket を使う
http= 0.0.0.0:9000

; http-timeout: HTTP 接続のタイムアウト（秒）
http-timeout=300

; socket-timeout: ソケット接続のタイムアウト（秒）
socket-timeout=300

; ========== バッファ設定 ==========
; buffer-size: リクエストヘッダーの最大バッファサイズ（バイト）
; Cookie が多いなどヘッダーが大きい場合はこの値を増やす
buffer-size=32768

; ========== リクエスト設定 ==========
; max-requests: ワーカーが処理するリクエスト数の上限
; この数に達したらワーカーを再起動（メモリリーク対策）
max-requests=1000

; max-worker-lifetime: ワーカーの最大稼働時間（秒）
; 3600秒（1時間）稼働したワーカーは再起動する
max-worker-lifetime=3600

; reload-on-rss: メモリ使用量（MB）がこの値を超えたらワーカーを再起動
reload-on-rss=512

; worker-reload-mercy: ワーカー再起動時に既存リクエストを待つ最大時間（秒）
worker-reload-mercy=60

; ========== ロギング設定 ==========
; log-date: ログに日時を付ける
log-date=true

; log-format: ログの出力フォーマット
; %(addr): クライアント IP、%(method): HTTP メソッド、%(status): ステータスコード
log-format= %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)"

; ========== プロセス名 ==========
; procname-prefix-spaced: ps コマンドで表示されるプロセス名のプレフィックス
procname-prefix-spaced= flask-todo-uwsgi

; ========== 統計サーバー設定 ==========
; stats: 統計情報を公開するアドレスとポート
; curl http://localhost:9191/ で JSON 形式のリアルタイム統計情報を取得できる
stats= 0.0.0.0:9191

; stats-http: 統計サーバーを HTTP 形式で公開する
stats-http=true

; ========== シグナル設定 ==========
; die-on-term: SIGTERM を受け取ったらプロセスを終了する（Docker のコンテナ停止に対応）
die-on-term=true

; need-app: アプリのロードに失敗したらサーバーを起動しない
need-app=true

; ========== 環境変数 ==========
; コンテナ起動時に設定するが、念のため ini ファイルにも記述
env= FLASK_APP=run.py
env= FLASK_DEBUG=0

; ========== Python 設定 ==========
; python-autoreload: Python ファイルの変更を自動検知して再起動（本番は 0 に）
python-autoreload=0

; lazy-apps: ワーカープロセスを fork した後にアプリをロードする
; True にするとメモリ消費が増えるが、フォーク後の初期化処理が正しく動く
lazy-apps=true